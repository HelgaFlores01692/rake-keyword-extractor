[project]
name = "rake-keyword-extractor"
version = "0.1.0"
description = "Python implementation of the RAKE algorithm for extracting keyphrases from English text with no external dependencies."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
